services:
  - type: web
    name: docbook-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.app.seed && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: docbook-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: http://localhost:3000
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      # Single Dedicated Admin Account
      - key: ADMIN_EMAIL
        value: admin@docbook.com
      - key: ADMIN_PASSWORD
        value: Admin@123
      - key: ADMIN_NAME
        value: System Admin
      # Optional: Add your Brevo & Telegram keys in Render Dashboard if used:
      # - key: BREVO_API_KEY
      #   value: ""
      # - key: TELEGRAM_BOT_TOKEN
      #   value: ""
      # - key: TELEGRAM_ADMIN_CHAT_ID
      #   value: ""

databases:
  - name: docbook-db
    databaseName: docbook_db
    user: docbook_user
    plan: free
